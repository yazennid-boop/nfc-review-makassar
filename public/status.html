<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacak Status Pesanan - NFC Google Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .google-gradient-bar {
            background: linear-gradient(90deg, #4285F4 0%, #EA4335 25%, #FBBC05 50%, #34A853 100%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-3 md:p-6">

    <main class="max-w-xl w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
        <div class="h-2.5 google-gradient-bar"></div>

        <div class="p-6 md:p-8 space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-white">Lacak Status Pesanan</h1>
                <p class="text-xs text-slate-400">Masukkan ID Pesanan (contoh: NFC-123456) atau Nomor WhatsApp Anda.</p>
            </div>

            <div class="flex gap-2">
                <input type="text" id="searchQuery" placeholder="Cari ID Order / No WhatsApp..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                <button type="button" onclick="trackOrder()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-md transition">Cari</button>
            </div>

            <div id="resultContainer" class="hidden space-y-4 pt-4 border-t border-slate-800">
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">ID Pesanan:</span>
                        <span id="resId" class="font-mono font-bold text-blue-400">-</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Nama Pemesan:</span>
                        <span id="resName" class="font-semibold text-white">-</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Nama Usaha:</span>
                        <span id="resBusiness" class="font-semibold text-white">-</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Paket:</span>
                        <span id="resPackage" class="font-semibold text-white">-</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">Total Pembayaran:</span>
                        <span id="resTotal" class="font-semibold text-emerald-400">-</span>
                    </div>
                    <div class="flex justify-between text-xs pt-2 border-t border-slate-800">
                        <span class="text-slate-400">Status Proses:</span>
                        <span id="resStatus" class="font-bold text-amber-400">-</span>
                    </div>
                </div>
            </div>

            <div id="errorMsg" class="hidden text-center text-xs text-red-400 font-semibold py-2"></div>

            <div class="pt-4 text-center">
                <a href="/" class="text-xs text-blue-400 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Form Pemesanan</a>
            </div>
        </div>
    </main>

    <script>
        async function trackOrder() {
            const query = document.getElementById('searchQuery').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const errorMsg = document.getElementById('errorMsg');

            if (!query) return alert('Masukkan ID Pesanan atau Nomor WhatsApp!');

            try {
                const res = await fetch('/api/track-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();

                if (data.success) {
                    errorMsg.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    document.getElementById('resId').innerText = data.order.orderId;
                    document.getElementById('resName').innerText = data.order.name;
                    document.getElementById('resBusiness').innerText = data.order.businessName;
                    document.getElementById('resPackage').innerText = data.order.packageType;
                    document.getElementById('resTotal').innerText = `Rp ${data.order.totalPrice.toLocaleString('id-ID')}`;
                    document.getElementById('resStatus').innerText = data.order.processStatus;
                } else {
                    resultContainer.classList.add('hidden');
                    errorMsg.classList.remove('hidden');
                    errorMsg.innerText = data.message;
                }
            } catch (err) {
                alert('Gagal melacak pesanan. Periksa koneksi server.');
            }
        }
    </script>
</body>
</html>
