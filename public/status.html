<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lacak Status Pesanan - NFC Makassar Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937' },
                        primary: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .glass-input { background: rgba(31, 41, 55, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between items-center">

    <div class="w-full max-w-md space-y-6">
        <!-- Header -->
        <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
            <a href="index.html" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</a>
            <h1 class="font-bold text-sm text-white">Lacak Pesanan</h1>
            <div class="w-6"></div>
        </div>

        <!-- Search Box -->
        <div class="glass-card rounded-2xl p-5 space-y-4">
            <h2 class="text-xs font-bold text-gray-300">Masukkan ID Pesanan atau Nomor WhatsApp</h2>
            <div class="flex space-x-2">
                <input type="text" id="searchInput" class="w-full px-3.5 py-2.5 rounded-xl glass-input text-xs" placeholder="Cth: NFC-123456 atau 0812...">
                <button onclick="searchOrder()" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">Cari</button>
            </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="space-y-4"></div>
    </div>

    <footer class="text-center text-[10px] text-gray-500 mt-10">
        <p>&copy; 2026 NFC Makassar Review. Real-Time Cloud Tracking.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://rbxkasjljehbejkehslr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJieGthc2psamVoYmVqa2Voc2xyIiwicm9sZSI6InJub24iLCJpYXQiOjE3OTE1NDQxMDMsImV4cCI6MjEwNzEyMDEwM30.HlAFJArWgzbvFjorcPgMVCrSBjXJdijsfUOMHHkfyRQ";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                document.getElementById('searchInput').value = id;
                searchOrder();
            }
        });

        async function searchOrder() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultContainer');
            if (!query) {
                alert('Masukkan ID Pesanan atau Nomor WhatsApp terlebih dahulu!');
                return;
            }

            container.innerHTML = `<div class="glass-card rounded-2xl p-5 text-center text-xs text-gray-400">Mencari data pesanan di cloud...</div>`;

            try {
                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .or(`orderId.ilike.%${query}%,whatsapp.ilike.%${query}%`);

                if (error) throw error;

                if (!orders || orders.length === 0) {
                    container.innerHTML = `<div class="glass-card rounded-2xl p-5 text-center text-xs text-rose-400">Pesanan dengan kata kunci tersebut tidak ditemukan.</div>`;
                    return;
                }

                let html = '';
                orders.forEach(o => {
                    html += `<div class="glass-card rounded-2xl p-5 space-y-3 border border-indigo-500/20">
                        <div class="flex justify-between items-center border-b border-white/10 pb-2">
                            <span class="font-bold text-indigo-400 text-sm">${o.orderId}</span>
                            <span class="px-2.5 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-[10px] font-bold">${o.processStatus || 'Diproses'}</span>
                        </div>
                        <div class="space-y-1 text-xs text-gray-300">
                            <p><strong>Nama Pemesan:</strong> ${o.name}</p>
                            <p><strong>Nama Bisnis:</strong> ${o.businessName}</p>
                            <p><strong>Paket NFC:</strong> ${o.packageType} Unit (Rp ${o.totalPrice.toLocaleString('id-ID')})</p>
                            <p><strong>Alamat:</strong> ${o.addressDetail}</p>
                            ${o.deliverySharelock ? `<a href="${o.deliverySharelock}" target="_blank" class="text-indigo-400 hover:underline block mt-1"><i class="fa-solid fa-location-dot mr-1"></i>Buka Lokasi Pengiriman</a>` : ''}
                        </div>
                        <div class="pt-2 border-t border-white/10 flex space-x-2">
                            <a href="https://wa.me/6289504749648?text=Halo%20Admin,%20saya%20ingin%20konfirmasi%20pesanan%20${o.orderId}" target="_blank" class="w-full py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-center font-bold text-xs">
                                <i class="fa-brands fa-whatsapp mr-1"></i> Hubungi Admin
                            </a>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="glass-card rounded-2xl p-5 text-center text-xs text-rose-400">Terjadi kesalahan koneksi database.</div>`;
            }
        }
    </script>
</body>
</html>
