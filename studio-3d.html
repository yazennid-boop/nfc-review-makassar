<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e6f7ff;background:radial-gradient(ellipse at 50% 35%,#16213a 0%,#080c16 62%,#04060b 100%)}

.btn{font:inherit;font-size:.8rem;font-weight:600;color:#bff6ff;background:rgba(10,18,34,.75);border:1px solid rgba(0,229,255,.5);border-radius:999px;padding:9px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.utama{background:rgba(0,229,255,.2);color:#fff}
.btn:focus-visible{outline:2px solid #7ff7ff;outline-offset:2px}
#overlay{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(88%,360px);background:rgba(8,14,28,.82);border:1px solid rgba(0,229,255,.5);border-radius:18px;padding:14px 16px;text-align:center;box-shadow:0 0 30px rgba(0,229,255,.22);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
#overlay.tampil{opacity:1;pointer-events:auto}

#overlay p{margin:6px 0 10px;font-size:.78rem;color:#a9dcf0}
.aksi{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

#statis{position:absolute;inset:0;display:grid;place-items:center}

.kartu-statis i{position:absolute;width:50%;height:50%}
.k1{left:0;top:0;background:#0f6bff}.k2{right:0;top:0;background:#ee2a24}.k3{right:0;bottom:0;background:#ffd500}.k4{left:0;bottom:0;background:#0aa04f}

  document.getElementById('statis').classList.remove('hidden');

  document.getElementById('kontrol').classList.add('hidden');
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('judul').classList.add('hidden');
}
window.tampilStatis = tampilStatis;

setTimeout(function () { if (!window.__studioSiap) tampilStatis(); }, 10000);

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* ===== Pengaturan utama ===== */
const JUDUL_KARTU = "Google Review Card";
const LOW = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3;
const RW = LOW ? 512 : 1024;
const DESAIN = 1254;
const S = RW / DESAIN;
const KURANGI_GERAK = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const SKALA_WAKTU = KURANGI_GERAK ? 0.55 : 1;

/* Ukuran kartu 12 x 12 cm (persegi) */
const KW = 1.2, KH = 1.2, KR = 0.12, KT = 0.04;
const BELT_Y = 0.6;
const CARD_Y = BELT_Y + 0.005 + KT / 2;
const FEED_X = -2.7, FEED_Y = 1.42;
const OUT_X = 3.1, BOX_X = 4.2, BOX_FLOOR = 0.04, BOX_CAP = 4;
const SPEED = 1.6;
const HEAD_REST = -1.05, SCAN_Z0 = -0.62, SCAN_Z1 = 0.62;
const TARGET = new THREE.Vector3(0.7, 0.9, 0);
const ARAH = new THREE.Vector3(0.22, 0.42, 1).normalize();
const VITRIN_POS = new THREE.Vector3(0.7, 1.3, 2.2);
const ARAH_DETAIL = new THREE.Vector3(0, 0.12, 1).normalize();

const FASE = [
  { n: "jatuh", d: 0.55 },
  { n: "masuk", d: 1.6 },
  { n: "scan", d: 2.2 },
  { n: "kilat", d: 0.35 },
  { n: "keluar", d: 1.9 },
  { n: "geser", d: 0.7 },
  { n: "kotak", d: 0.5 },
];

const $ = (id) => document.getElementById(id);
const smooth = (t) => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const stackY = (i) => BOX_FLOOR + KT / 2 + i * (KT + 0.006);

function cekWebGL() {
  try {
    const c = document.createElement("canvas");
    return !!(c.getContext("webgl2") || c.getContext("webgl"));
  } catch (e) { return false; }
}

function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function bentukRounded(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function buatGeoPelat(bentuk) {
  const geo = new THREE.ShapeGeometry(bentuk, 10);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    uv.setXY(i, (pos.getX(i) + KW / 2) / KW, (pos.getY(i) + KH / 2) / KH);
  }
  return geo;
}

function bintang(g, cx, cy, r, warna) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rr = i % 2 ? r * 0.45 : r;
    g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  g.closePath();
  g.fillStyle = warna;
  g.fill();
}

function gambarQR(g, x, y, s) {
  const n = 25, m = s / n;
  let seed = 7;
  const acak = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  g.fillStyle = "#111";
  for (let i = 0; i < n; i++)
    for (let j = 0; j < n; j++)
      if (acak() > 0.5) g.fillRect(x + i * m, y + j * m, m, m);
  for (const [fx, fy] of [[0, 0], [n - 7, 0], [0, n - 7]]) {
    g.fillStyle = "#fff"; g.fillRect(x + (fx - 1) * m, y + (fy - 1) * m, 9 * m, 9 * m);
    g.fillStyle = "#111"; g.fillRect(x + fx * m, y + fy * m, 7 * m, 7 * m);
    g.fillStyle = "#fff"; g.fillRect(x + (fx + 1) * m, y + (fy + 1) * m, 5 * m, 5 * m);
    g.fillStyle = "#111"; g.fillRect(x + (fx + 2) * m, y + (fy + 2) * m, 3 * m, 3 * m);
  }
}

/* Desain bawaan (dipakai jika assets/desain-kartu.png belum ada) */
function gambarDesainBawaan(g) {
  g.setTransform(S, 0, 0, S, 0, 0);
  g.fillStyle = "#ffffff";
  g.fillRect(0, 0, DESAIN, DESAIN);
  g.save();
  rrect(g, 40, 40, 1174, 1174, 120);
  g.clip();
  g.fillStyle = "#0f6bff"; g.fillRect(40, 40, 587, 587);
  g.fillStyle = "#ee2a24"; g.fillRect(627, 40, 587, 587);
  g.fillStyle = "#ffd500"; g.fillRect(627, 627, 587, 587);
  g.fillStyle = "#0aa04f"; g.fillRect(40, 627, 587, 587);
  g.restore();
  g.fillStyle = "#f8f9fb";
  rrect(g, 140, 298, 970, 792, 60);
  g.fill();
  g.beginPath(); g.arc(625, 265, 150, 0, Math.PI * 2); g.fillStyle = "#ffffff"; g.fill();
  g.lineWidth = 58; g.lineCap = "butt";
  const busur = (a1, a2, warna) => {
    g.strokeStyle = warna; g.beginPath(); g.arc(625, 265, 96, a1, a2); g.stroke();
  };
  busur(-2.75, -0.55, "#ee2a24");
  busur(-0.55, 0.6, "#0f6bff");
  busur(0.6, 2.3, "#0aa04f");
  busur(2.3, 2.75, "#ffd500");
  g.fillStyle = "#0f6bff"; g.fillRect(625, 236, 125, 58);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#111111";
  g.font = "500 64px Arial, sans-serif"; g.fillText("Bantu Kami Dengan", 627, 445);
  g.font = "bold 120px Arial, sans-serif"; g.fillText("Google Review", 627, 535);
  for (let i = 0; i < 5; i++) bintang(g, 527 + i * 50, 630, 22, "#fbbc05");
  g.strokeStyle = "#111111"; g.lineWidth = 9;
  g.beginPath(); g.ellipse(300, 835, 96, 66, 0, 0, Math.PI * 2); g.stroke();
  g.font = "bold 42px Arial, sans-serif"; g.fillStyle = "#111111";
  g.fillText("NFC", 282, 835);
  g.lineWidth = 8;
  for (const r of [120, 146, 172]) {
    g.beginPath(); g.arc(360, 835, r, -0.7, 0.7); g.stroke();
  }
  g.lineWidth = 10;
  rrect(g, 470, 745, 108, 180, 16); g.stroke();
  rrect(g, 540, 850, 70, 80, 12); g.stroke();
  g.lineWidth = 5;
  g.beginPath(); g.moveTo(627, 692); g.lineTo(627, 795); g.moveTo(627, 890); g.lineTo(627, 998); g.stroke();
  g.fillStyle = "#111111";
  g.font = "bold 28px Arial, sans-serif";
  g.fillText("ATAU", 627, 843);
  gambarQR(g, 752, 712, 250);
  g.font = "bold 30px Arial, sans-serif";
  g.fillText("TEMPELKAN HP KAMU", 388, 1020);
  g.fillText("SCAN QR", 878, 1020);
}

/* Kartu kosong sebelum dipindai */
function gambarKosong(g) {
  g.setTransform(S, 0, 0, S, 0, 0);
  g.fillStyle = "#e9eef5";
  g.fillRect(0, 0, DESAIN, DESAIN);
  g.strokeStyle = "#c5cfdd"; g.lineWidth = 12;
  g.strokeRect(20, 20, DESAIN - 40, DESAIN - 40);
}

function jalankanStudio() {
  /* ----- Renderer, lingkungan, kamera ----- */
  const renderer = new THREE.WebGLRenderer({ antialias: !LOW, alpha: true, powerPreference: "high-performance" });
  let skalaPiksel = Math.min(window.devicePixelRatio || 1, LOW ? 1.25 : 2);
  renderer.setPixelRatio(skalaPiksel);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  $("scene").appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();

  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
  const kontrol = new OrbitControls(camera, renderer.domElement);
  kontrol.target.copy(TARGET);
  kontrol.enableDamping = true;
  kontrol.dampingFactor = 0.07;
  kontrol.enablePan = false;
  kontrol.rotateSpeed = 0.6;
  kontrol.zoomSpeed = 0.8;
  kontrol.autoRotateSpeed = 0.35;

  let jarak = 9, jarakDetail = 3.5, batasMin = 4, batasMax = 14;
  const posisiHome = new THREE.Vector3();
  const posisiIntro = new THREE.Vector3();
  const tmpV = new THREE.Vector3();
  const tmpV2 = new THREE.Vector3();

  let intro = true, introT = 0, resetAktif = false, sudahSentuh = false;
  let fokusDetail = false, transisi = false;
  let jeda = false, loopAktif = true, mulaiDelay = 1.2;
  let kartuAktif = null, fase = 0, tFase = 0;
  let kotak = [], bersih = false, tBersih = 0;
  let beltV = 0, beltOffset = 0;

  function pasangBatasNormal() {
    kontrol.minDistance = batasMin;
    kontrol.maxDistance = batasMax;
    kontrol.minPolarAngle = 0.25;
    kontrol.maxPolarAngle = Math.PI * 0.47;
  }

  function pasangBatasDetail() {
    kontrol.minDistance = 1.2;
    kontrol.maxDistance = 7;
    kontrol.minPolarAngle = 0.01;
    kontrol.maxPolarAngle = Math.PI - 0.01;
  }

  function ukur() {
    const w = Math.max(1, $("scene").clientWidth), h = Math.max(1, $("scene").clientHeight);
    renderer.setSize(w, h, false);
    const a = w / h;
    camera.aspect = a;
    camera.fov = a < 1 ? 56 : 36;
    camera.updateProjectionMatrix();
    const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    jarak = Math.max(4.6 / (tv * a), 1.6 / tv) * 1.22;
    jarakDetail = Math.max(1.5 / (2 * tv), 1.4 / (2 * tv * a));
    batasMin = jarak * 0.45;
    batasMax = jarak * 1.6;
    posisiHome.copy(TARGET).addScaledVector(ARAH, jarak);
    posisiIntro.copy(TARGET).addScaledVector(ARAH, jarak * 1.7);
    if (!fokusDetail) pasangBatasNormal();
    if (!intro && !sudahSentuh) camera.position.copy(posisiHome);
  }

  kontrol.addEventListener("start", () => {
    intro = false;
    resetAktif = false;
    transisi = false;
    sudahSentuh = true;
    kontrol.autoRotate = false;
  });

  /* ----- Cahaya ----- */
  scene.add(new THREE.HemisphereLight(0xdde8ff, 0x070b14, 0.6));
  const kunci = new THREE.DirectionalLight(0xffffff, 1.4);
  kunci.position.set(3, 9, 6);
  scene.add(kunci);
  const tepi = new THREE.DirectionalLight(0x00e5ff, 1.3);
  tepi.position.set(-6, 5, -7);
  scene.add(tepi);

  /* ----- Lantai dan bayangan ----- */
  const lantai = new THREE.Mesh(
    new THREE.CircleGeometry(14, 72),
    new THREE.MeshStandardMaterial({ color: 0x0a1020, roughness: 0.5, metalness: 0.15 })
  );
  lantai.rotation.x = -Math.PI / 2;
  scene.add(lantai);

  const cincin = new THREE.Mesh(
    new THREE.RingGeometry(6.6, 6.66, 128),
    new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.35, depthWrite: false })
  );
  cincin.rotation.x = -Math.PI / 2;
  cincin.position.y = 0.003;
  scene.add(cincin);

  const texBlob = (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const gr = g.createRadialGradient(64, 64, 6, 64, 64, 64);
    gr.addColorStop(0, "rgba(0,0,0,0.65)");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();
  function bayangan(w, d, x, z) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, d),
      new THREE.MeshBasicMaterial({ map: texBlob, transparent: true, depthWrite: false })
    );
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.004, z);
    scene.add(m);
  }
  bayangan(8.0, 3.0, TARGET.x, 0);
  bayangan(2.6, 2.4, FEED_X, 0);
  bayangan(2.6, 2.4, BOX_X, 0);

  const bahanLogam = (warna, metal = 0.6, rough = 0.35) =>
    new THREE.MeshStandardMaterial({ color: warna, metalness: metal, roughness: rough });

  /* ----- Treadmill ----- */
  const mesin = new THREE.Group();
  mesin.userData.mesin = true;
  scene.add(mesin);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.3, 2.2), bahanLogam(0x1a2233));
  deck.position.set(0, BELT_Y - 0.15, 0);
  mesin.add(deck);

  for (const x of [-2.9, 2.9]) {
    for (const z of [-0.95, 0.95]) {
      const kaki = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.3, 12), bahanLogam(0x222b3d));
      kaki.position.set(x, 0.15, z);
      mesin.add(kaki);
    }
  }

  for (const x of [-3.05, 3.05]) {
    const rol = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.0, 24), bahanLogam(0x2c3750, 0.5, 0.4));
    rol.rotation.x = Math.PI / 2;
    rol.position.set(x, BELT_Y - 0.15, 0);
    mesin.add(rol);
  }

  const texSabuk = (() => {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 64;
    const g = c.getContext("2d");
    g.fillStyle = "#141b2b"; g.fillRect(0, 0, 256, 64);
    for (let i = 0; i < 256; i += 32) { g.fillStyle = "#253049"; g.fillRect(i, 0, 12, 64); }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(10, 1);
    return t;
  })();
  const sabuk = new THREE.Mesh(
    new THREE.PlaneGeometry(6.2, 1.9),
    new THREE.MeshStandardMaterial({ map: texSabuk, roughness: 0.6, metalness: 0.25 })
  );
  sabuk.rotation.x = -Math.PI / 2;
  sabuk.position.set(0, BELT_Y + 0.002, 0);
  mesin.add(sabuk);

  for (const z of [-0.96, 0.96]) {
    const garis = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.012, 0.03), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
    garis.position.set(0, BELT_Y + 0.006, z);
    mesin.add(garis);
  }

  /* ----- Gerbang scan ----- */
  const gerbang = new THREE.Group();
  gerbang.userData.mesin = true;
  scene.add(gerbang);
  for (const z of [-1.1, 1.1]) {
    const tiang = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9, 0.14), bahanLogam(0x2c3750, 0.7, 0.3));
    tiang.position.set(0, BELT_Y + 0.45, z);
    gerbang.add(tiang);
  }
  const balok = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.12, 2.34), bahanLogam(0x2c3750, 0.7, 0.3));
  balok.position.set(0, 1.5, 0);
  gerbang.add(balok);
  const garisRel = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.02, 2.2), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
  garisRel.position.set(0, 1.44, 0);
  gerbang.add(garisRel);

  /* ----- Kepala scan ----- */
  const kepala = new THREE.Group();
  kepala.position.set(0, 1.4, HEAD_REST);
  scene.add(kepala);
  kepala.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.14, 0.26), bahanLogam(0x26324b, 0.5, 0.35)));
  const lensa = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 0.18), new THREE.MeshBasicMaterial({ color: 0x7ff7ff }));
  lensa.position.y = -0.08;
  kepala.add(lensa);

  /* ----- Laser scan ----- */
  const laser = new THREE.Mesh(
    new THREE.BoxGeometry(KW + 0.1, 0.008, 0.02),
    new THREE.MeshBasicMaterial({ color: 0x7ff7ff })
  );
  const laserGlow = new THREE.Mesh(
    new THREE.PlaneGeometry(KW + 0.1, 0.16),
    new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  laserGlow.rotation.x = -Math.PI / 2;
  laser.visible = false;
  laserGlow.visible = false;
  scene.add(laser, laserGlow);

  /* ----- Pengumpan ----- */
  const pengumpan = new THREE.Group();
  pengumpan.userData.mesin = true;
  scene.add(pengumpan);
  const bahanPengumpan = bahanLogam(0x26324b, 0.5, 0.4);
  const yP = 1.7, tinggiP = 0.5;
  const dinding = (w, h, d, x, y, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bahanPengumpan);
    m.position.set(x, y, z);
    pengumpan.add(m);
  };
  dinding(1.9, tinggiP, 0.05, FEED_X, yP, 0.8);
  dinding(1.9, tinggiP, 0.05, FEED_X, yP, -0.8);
  dinding(0.05, tinggiP, 1.6, FEED_X - 0.925, yP, 0);
  dinding(0.05, tinggiP, 1.6, FEED_X + 0.925, yP, 0);
  for (const z of [-0.95, 0.95]) {
    const tp = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.85, 0.08), bahanLogam(0x222b3d));
    tp.position.set(FEED_X, BELT_Y + 0.425, z);
    pengumpan.add(tp);
  }
  const matKosongPengumpan = new THREE.MeshStandardMaterial({ color: 0xe6ecf5, roughness: 0.5 });
  for (let i = 0; i < 4; i++) {
    const k = new THREE.Mesh(new THREE.BoxGeometry(KW, KT, KH), matKosongPengumpan);
    k.position.set(FEED_X, 1.52 + i * (KT + 0.01), 0);
    pengumpan.add(k);
  }

  /* ----- Kardus ----- */
  const kardus = new THREE.Group();
  scene.add(kardus);
  const matKardus = new THREE.MeshStandardMaterial({ color: 0xa7825a, roughness: 0.9 });
  const lantaiK = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.04, 1.7), matKardus);
  lantaiK.position.set(BOX_X, 0.02, 0);
  const sisiDepan = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.4, 0.05), matKardus);
  sisiDepan.position.set(BOX_X, 0.2, 0.825);
  const sisiBelakang = sisiDepan.clone();
  sisiBelakang.position.z = -0.825;
  const sisiKiri = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.4, 1.7), matKardus);
  sisiKiri.position.set(BOX_X - 0.925, 0.2, 0);
  const sisiKanan = sisiKiri.clone();
  sisiKanan.position.x = BOX_X + 0.925;
  kardus.add(lantaiK, sisiDepan, sisiBelakang, sisiKiri, sisiKanan);

  /* ----- Bahan kartu ----- */
  const bentuk = bentukRounded(KW, KH, KR);
  const geoBadan = new THREE.ExtrudeGeometry(bentuk, { depth: KT, bevelEnabled: false, curveSegments: 8 });
  geoBadan.translate(0, 0, -KT / 2);
  const matBadan = new THREE.MeshPhysicalMaterial({ color: const matBadan = new THREE.MeshPhysicalMaterial({ color: 0xf4f7fb, roughness: 0.25, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.2 });
  const geoPelat = buatGeoPelat(bentuk);
  const matBelakang = new THREE.MeshStandardMaterial({ color: 0xf1f4f9, roughness: 0.6 });

  /* Kanvas desain: dipakai untuk kartu di mesin dan kartu yang diperbesar */
  const kanvasDesain = document.createElement("canvas");
  kanvasDesain.width = RW; kanvasDesain.height = RW;
  gambarDesainBawaan(kanvasDesain.getContext("2d"));

  const imgDesain = new Image();
  imgDesain.onload = () => {
    const g = kanvasDesain.getContext("2d");
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, RW, RW);
    g.drawImage(imgDesain, 0, 0, RW, RW);
    texDesainDetail.needsUpdate = true;
    for (const k of kartuList) k.h = -1;
  };
  imgDesain.src = "assets/desain-kartu.png";

  const texDesainDetail = new THREE.CanvasTexture(kanvasDesain);
  texDesainDetail.colorSpace = THREE.SRGBColorSpace;
  texDesainDetail.anisotropy = LOW ? 1 : 4;

  /* ----- Pool kartu di mesin ----- */
  const POOL = BOX_CAP + 2;
  const kartuList = [];
  for (let i = 0; i < POOL; i++) {
    const cv = document.createElement("canvas");
    cv.width = RW; cv.height = RW;
    const ctx = cv.getContext("2d");
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = LOW ? 1 : 4;
    const matDepan = new THREE.MeshStandardMaterial({
      map: tex, roughness: 0.38, metalness: 0.05,
      emissive: 0x9ff6ff, emissiveIntensity: 0,
    });
    const grup = new THREE.Group();
    grup.rotation.x = -Math.PI / 2;
    const badan = new THREE.Mesh(geoBadan, matBadan);
    const depan = new THREE.Mesh(geoPelat, matDepan);
    depan.position.z = KT / 2 + 0.002;
    const belakang = new THREE.Mesh(geoPelat, matBelakang);
    belakang.rotation.y = Math.PI;
    belakang.position.z = -KT / 2 - 0.002;
    grup.add(badan, depan, belakang);
    grup.visible = false;
    scene.add(grup);
    const k = { grup, cv, ctx, tex, matDepan, state: "bebas", selesai: false, h: -1, stack: -1 };
    grup.userData.kartu = k;
    kartuList.push(k);
  }

  // Gambar kartu bertahap dari atas ke bawah (p = 0..1)
  const kanvasKosong = document.createElement("canvas");
  kanvasKosong.width = RW; kanvasKosong.height = RW;
  gambarKosong(kanvasKosong.getContext("2d"));

  function gambarKartu(k, p) {
    const h = Math.round(RW * p);
    if (h === k.h) return;
    k.h = h;
    const g = k.ctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, RW, RW);
    g.drawImage(kanvasKosong, 0, 0);
    if (h > 0) g.drawImage(kanvasDesain, 0, 0, RW, h, 0, 0, RW, h);
    if (p > 0 && p < 1) {
      g.fillStyle = "rgba(0,229,255,0.14)";
      g.fillRect(0, Math.max(0, h - 26 * S), RW, 26 * S);
      g.fillStyle = "rgba(170,250,255,0.95)";
      g.fillRect(0, h - 2 * S, RW, Math.max(2, 4 * S));
    }
    k.tex.needsUpdate = true;
  }

  /* ----- Kartu diperbesar (saat diketuk): depan desain, belakang putih + double tape ----- */
  const vitrin = new THREE.Group();
  vitrin.position.copy(VITRIN_POS);
  vitrin.visible = false;
  scene.add(vitrin);
  const vBadan = new THREE.Mesh(geoBadan, matBadan);
  vitrin.add(vBadan);
  const vDepan = new THREE.Mesh(geoPelat, new THREE.MeshStandardMaterial({ map: texDesainDetail, roughness: 0.3, metalness: 0.05 }));
  vDepan.position.z = KT / 2 + 0.002;
  vitrin.add(vDepan);
  const vBelakang = new THREE.Mesh(geoPelat, matBelakang);
  vBelakang.rotation.y = Math.PI;
  vBelakang.position.z = -KT / 2 - 0.002;
  vitrin.add(vBelakang);
  const vTape = new THREE.Mesh(
    new THREE.BoxGeometry(KW / 3, KH * 0.26, 0.012),
    new THREE.MeshStandardMaterial({ color: 0xf6f8fc, roughness: 0.35, metalness: 0 })
  );
  vTape.position.set(0, 0, -KT / 2 - 0.002 - 0.006);
  vitrin.add(vTape);
  const vTapeLapis = new THREE.Mesh(
    new THREE.BoxGeometry(KW / 3 + 0.02, KH * 0.26 + 0.02, 0.006),
    new THREE.MeshStandardMaterial({ color: 0xc9d2e0, roughness: 0.5, metalness: 0 })
  );
  vTapeLapis.position.set(0, 0, -KT / 2 - 0.002 - 0.003);
  vitrin.add(vTapeLapis);
  vitrin.userData.kartu = null;

  /* ----- Pose kartu dan kepala per fase ----- */
  function atur(k, nama, p) {
    let x = 0, y = CARD_Y, hz = HEAD_REST, reveal = 0, flash = 0, laserOn = false;
    switch (nama) {
      case "jatuh":
        x = FEED_X; y = lerp(FEED_Y, CARD_Y, p * p);
        break;
      case "masuk":
        x = lerp(FEED_X, 0, p);
        hz = lerp(HEAD_REST, SCAN_Z0, smooth(p));
        break;
      case "scan":
        x = 0; hz = lerp(SCAN_Z0, SCAN_Z1, p);
        reveal = p; laserOn = true;
        break;
      case "kilat":
        x = 0; reveal = 1;
        hz = lerp(SCAN_Z1, HEAD_REST, smooth(p));
        flash = Math.sin(p * Math.PI) * 0.5;
        break;
      case "keluar":
        x = lerp(0, OUT_X, p); reveal = 1;
        break;
      case "geser":
        x = lerp(OUT_X, BOX_X, smooth(p)); reveal = 1;
        break;
      case "kotak":
        x = BOX_X; reveal = 1;
        y = lerp(CARD_Y, stackY(k.stack), p * p);
        break;
    }
    k.grup.position.set(x, y, 0);
    k.matDepan.emissiveIntensity = flash;
    gambarKartu(k, reveal);

    kepala.position.z = hz;
    laser.visible = laserOn;
    laserGlow.visible = laserOn;
    if (laserOn) {
      laser.position.set(0, CARD_Y + KT / 2 + 0.012, hz);
      laserGlow.position.set(0, CARD_Y + KT / 2 + 0.01, hz);
    }
  }

  /* ----- Alur produksi ----- */
  function mulaiKartu() {
    const k = kartuList.find((c) => c.state === "bebas");
    if (!k) return;
    k.state = "aktif";
    k.selesai = false;
    k.stack = -1;
    k.grup.visible = true;
    k.grup.scale.setScalar(1);
    k.matDepan.emissiveIntensity = 0;
    kartuAktif = k;
    fase = 0;
    tFase = 0;
    atur(k, FASE[0].n, 0);
  }

  function selesaiKartu() {
    const k = kartuAktif;
    k.state = "kotak";
    k.stack = kotak.length;
    kotak.push(k);
    kartuAktif = null;
    if (kotak.length >= BOX_CAP) {
      bersih = true;
      tBersih = 0;
    } else if (!loopAktif) {
      jeda = true;
      $("btnMulai").textContent = "Lanjutkan";
    } else {
      mulaiKartu();
    }
  }

  function perbaruiLogika(dt) {
    if (jeda) return;
    if (mulaiDelay > 0) mulaiDelay -= dt;

    if (bersih) {
      tBersih += dt;
      if (tBersih > 0.9) {
        const s = Math.max(0.001, 1 - (tBersih - 0.9) / 0.5);
        for (const k of kotak) k.grup.scale.setScalar(s);
      }
      if (tBersih >= 1.4) {
        for (const k of kotak) {
          k.grup.visible = false;
          k.grup.scale.setScalar(1);
          k.state = "bebas";
          k.selesai = false;
          k.stack = -1;
        }
        kotak = [];
        bersih = false;
        if (loopAktif) mulaiKartu();
        else { jeda = true; $("btnMulai").textContent = "Lanjutkan"; }
      }
      return;
    }

    if (!kartuAktif) {
      if (mulaiDelay <= 0) mulaiKartu();
      return;
    }

    tFase += dt;
    let d = FASE[fase].d;
    while (tFase >= d) {
      tFase -= d;
      fase++;
      if (fase >= FASE.length) { selesaiKartu(); return; }
      if (FASE[fase].n === "kilat") kartuAktif.selesai = true;
      d = FASE[fase].d;
    }
    atur(kartuAktif, FASE[fase].n, tFase / d);
  }

  /* ----- Sabuk ----- */
  function perbaruiSabuk(dt) {
    const scanNow = kartuAktif && FASE[fase] && FASE[fase].n === "scan";
    const target = jeda || scanNow || fokusDetail ? 0 : SPEED;
    beltV += (target - beltV) * Math.min(1, dt * 4);
    beltOffset -= (beltV * dt * 10) / 6.2;
    texSabuk.offset.x = beltOffset % 1;
  }

  /* ----- Detail kartu ----- */
  function bukaDetail() {
    fokusDetail = true;
    transisi = true;
    intro = false;
    sudahSentuh = true;
    pasangBatasDetail();
    kontrol.autoRotate = true;
    kontrol.autoRotateSpeed = 1.2;
    vitrin.visible = true;
    $("judul").classList.add("hidden");
    $("judulKartu").textContent = JUDUL_KARTU;
    $("overlay").classList.add("tampil");
  }

  function tutupDetail() {
    if (!fokusDetail) return;
    fokusDetail = false;
    transisi = false;
    vitrin.visible = false;
    $("overlay").classList.remove("tampil");
    $("judul").classList.remove("hidden");
    kontrol.autoRotate = false;
    pasangBatasNormal();
    resetAktif = true;
  }

  function togglePause() {
    jeda = !jeda;
    $("btnMulai").textContent = jeda ? "Lanjutkan" : "Jeda";
  }

  $("btnTutup").addEventListener("click", tutupDetail);
  $("btnMulai").addEventListener("click", togglePause);
  $("btnLoop").addEventListener("click", () => {
    loopAktif = !loopAktif;
    $("btnLoop").textContent = "Putar terus: " + (loopAktif ? "On" : "Off");
  });
  $("btnReset").addEventListener("click", () => {
    if (fokusDetail) { tutupDetail(); return; }
    resetAktif = true;
    intro = false;
    sudahSentuh = true;
    kontrol.autoRotate = false;
  });

  /* ----- Ketuk ----- */
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const elemen = renderer.domElement;
  let tekanX = 0, tekanY = 0;
  elemen.addEventListener("pointerdown", (e) => { tekanX = e.clientX; tekanY = e.clientY; });
  elemen.addEventListener("pointerup", (e) => {
    if (Math.hypot(e.clientX - tekanX, e.clientY - tekanY) > 8) return;
    const r = elemen.getBoundingClientRect();
    pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);

    if (fokusDetail) {
      const hitVitrin = raycaster.intersectObject(vitrin, true).length > 0;
      if (!hitVitrin) tutupDetail();
      return;
    }

    const targets = [...kartuList.map((k) => k.grup).filter((g) => g.visible), mesin, gerbang, pengumpan];
    const hits = raycaster.intersectObjects(targets, true);
    if (!hits.length) return;
    let o = hits[0].object;
    while (o && !o.userData.kartu && !o.userData.mesin) o = o.parent;
    if (!o) return;
    if (o.userData.kartu) {
      if (o.userData.kartu.selesai) bukaDetail();
    } else {
      togglePause();
    }
  });

  /* ----- Keyboard ----- */
  window.addEventListener("keydown", (e) => {
    const k = e.key;
    const kiri = k === "ArrowLeft", kanan = k === "ArrowRight";
    const atas = k === "ArrowUp", bawah = k === "ArrowDown";
    const zoomIn = k === "+" || k === "=", zoomOut = k === "-";
    if (!(kiri || kanan || atas || bawah || zoomIn || zoomOut)) return;
    if (fokusDetail) return;
    e.preventDefault();
    const off = new THREE.Vector3().subVectors(camera.position, kontrol.target);
    const sph = new THREE.Spherical().setFromVector3(off);
    if (kiri) sph.theta -= 0.12;
    if (kanan) sph.theta += 0.12;
    if (atas) sph.phi -= 0.08;
    if (bawah) sph.phi += 0.08;
    if (zoomIn) sph.radius *= 0.9;
    if (zoomOut) sph.radius *= 1.1;
    sph.phi = THREE.MathUtils.clamp(sph.phi, kontrol.minPolarAngle, kontrol.maxPolarAngle);
    sph.radius = THREE.MathUtils.clamp(sph.radius, kontrol.minDistance, kontrol.maxDistance);
    camera.position.copy(kontrol.target).add(new THREE.Vector3().setFromSpherical(sph));
    intro = false;
    sudahSentuh = true;
    kontrol.autoRotate = false;
  });

  /* ----- Loop render ----- */
  let rafId = 0;
  let lastT = performance.now();
  let sampel = [], frameKe = 0;

  function frame(now) {
    if (document.hidden) { rafId = 0; return; }
    const dtNyata = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    const dt = dtNyata * SKALA_WAKTU;

    // Turunkan resolusi otomatis jika frame rate terlalu rendah
    frameKe++;
    if (frameKe > 60) {
      sampel.push(dtNyata);
      if (sampel.length >= 90) {
        const rata = sampel.reduce((a, b) => a + b, 0) / sampel.length;
        sampel = [];
        if (rata > 0.034 && skalaPiksel > 1) {
          skalaPiksel = 1;
          renderer.setPixelRatio(1);
          ukur();
        }
      }
    }

    perbaruiLogika(dt);
    perbaruiSabuk(dt);
    if (fokusDetail) vitrin.position.y = VITRIN_POS.y + Math.sin(now / 900) * 0.03;

    if (intro) {
      introT += dt;
      const t = Math.min(1, introT / 2.4);
      camera.position.lerpVectors(posisiIntro, posisiHome, smooth(t));
      kontrol.target.copy(TARGET);
      camera.lookAt(TARGET);
      if (t >= 1) {
        intro = false;
        kontrol.autoRotate = !KURANGI_GERAK;
      }
    } else if (fokusDetail) {
      if (transisi) {
        kontrol.target.lerp(VITRIN_POS, 0.1);
        tmpV2.copy(VITRIN_POS).addScaledVector(ARAH_DETAIL, jarakDetail);
        camera.position.lerp(tmpV2, 0.08);
        if (camera.position.distanceTo(tmpV2) < 0.03 && kontrol.target.distanceTo(VITRIN_POS) < 0.03) {
          transisi = false;
        }
      }
    } else if (resetAktif) {
      kontrol.target.lerp(TARGET, 0.12);
      camera.position.lerp(posisiHome, 0.1);
      if (camera.position.distanceTo(posisiHome) < 0.02) resetAktif = false;
    }
    if (!intro) kontrol.update();

    renderer.render(scene, camera);
    rafId = requestAnimationFrame(frame);
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !rafId) {
      lastT = performance.now();
      rafId = requestAnimationFrame(frame);
    }
  });

  /* ----- Inisialisasi ----- */
  ukur();
  pasangBatasNormal();
  camera.position.copy(posisiIntro);
  kontrol.target.copy(TARGET);
  rafId = requestAnimationFrame(frame);
  window.__studioSiap = true;
}

if (!cekWebGL()) {
  window.tampilStatis();
} else {
  try {
    jalankanStudio();
  } catch (e) {
    window.tampilStatis();
  }
}
</script>
</body>
</html>
